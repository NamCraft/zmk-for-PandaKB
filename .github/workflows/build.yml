name: Build ZMK Firmware

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ZMK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-

      - name: Initialize workspace (west init)
        uses: zmkfirmware/zmk-action-bootstrap@v2

      - name: Build Firmware
        uses: zmkfirmware/zmk-action-build@v2
        with:
          # Hier bauen wir exakt nur deine benötigten 3 Dateien!
          matrix: |
            # === Linke Hälfte mit OLED ===
            - board: nice_nano_v2
              shield: Corne_L nice_oled
              snippet: studio-rpc-usb-uart
              artifact-name: Corne_left_oled

            # === Rechte Hälfte mit OLED ===
            - board: nice_nano_v2
              shield: Corne_R nice_oled
              artifact-name: Corne_right_oled

            # === Reset-Firmware (Fehlerbehebung) ===
            - board: nice_nano_v2
              shield: settings_reset
              artifact-name: settings_reset
