# ==========================================
# 1. SYSTEM & BLUETOOTH
# ==========================================
# Dein individueller Tastatur-Name im Bluetooth-Menü
CONFIG_ZMK_KEYBOARD_NAME="PandaKB_Corne"

# Erhöht die Bluetooth-Sendeleistung für eine stabile Verbindung zum PC
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Behebt den bekannten Windows-Bug bei der Batterieanzeige
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Intervall für die Batteriestandsberichte in Sekunden
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Erhöht das Entprellen (Debounce) gegen doppelte Tastenanschläge
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


# ==========================================
# 2. OLED DISPLAY (ZMK STANDARD)
# ==========================================
# Aktiviert die Display-Unterstützung allgemein
CONFIG_ZMK_DISPLAY=y

# Nutzt einen eigenen Prozessor-Thread für das Display (verhindert Laggen)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Aktiviert das absolut stabile ZMK-Standard-Layout
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Aktiviert die klassischen ZMK-Standard-Anzeigen (Layer, Akku, Verbindung)
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n


# ==========================================
# 3. RGB UNDERGLOW & ENERGIE
# ==========================================
# Aktiviert die RGB-Beleuchtung
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Schaltet RGB automatisch aus, wenn die Tastatur untätig ist
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Helligkeitseinstellungen für die LEDs (Maximal 60% schont den Akku)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# Bestimmt die Farbe beim allerersten Start (0 = Rot, 120 = Grün, 240 = Blau, etc.)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=290

# Bestimmt die Sättigung beim Start (100 = volle, kräftige Farbe)
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Bestimmt den Standard-Effekt beim Start (0 = Statische Farbe, 1 = Atmen, 2 = Regenbogen-Farbwechsel)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1

# Aktiviert den automatischen Tiefschlaf nach Inaktivität
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
