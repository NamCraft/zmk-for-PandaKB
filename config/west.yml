manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: namcraft
      url-base: https://github.com/namcraft

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
      path: modules/zmk-module-ble-management

    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
      path: modules/zmk-module-settings-rpc

    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
      path: modules/zmk-module-battery-history
      
    - name: zmk-studio-messages
      remote: cormoran
      revision: main
      path: modules/msgs/zmk-studio-messages

    - name: zmk-nice-oled
      remote: namcraft
      revision: main
      path: modules/zmk-nice-oled

  self:
    path: config
